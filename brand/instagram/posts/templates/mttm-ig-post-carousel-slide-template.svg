<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Carousel slide"><title>Carousel slide</title><rect width="1080" height="1350" fill="#EFEBE3"/><text x="96" y="330" font-family="MTTM Lettering" font-weight="400" font-size="157.14" letter-spacing="0" text-anchor="start" fill="#0E0E0D" data-field="number">02</text><text x="96" y="540" font-family="Manrope" font-weight="600" font-size="63.89" letter-spacing="0" text-anchor="start" fill="#0E0E0D" data-field="heading">Cat–cow, 60 seconds</text><text x="96" y="650" font-family="Manrope" font-weight="400" font-size="44.44" letter-spacing="0" text-anchor="start" fill="#0E0E0D" data-field="body1">Move slowly with your breath.</text><text x="96" y="712" font-family="Manrope" font-weight="400" font-size="44.44" letter-spacing="0" text-anchor="start" fill="#0E0E0D" data-field="body2">Round on the exhale, open</text><text x="96" y="774" font-family="Manrope" font-weight="400" font-size="44.44" letter-spacing="0" text-anchor="start" fill="#0E0E0D" data-field="body3">on the inhale. Keep the</text><text x="96" y="836" font-family="Manrope" font-weight="400" font-size="44.44" letter-spacing="0" text-anchor="start" fill="#0E0E0D" data-field="body4">neck long.</text><rect x="96" y="1150" width="888" height="2" fill="#0E0E0D" fill-opacity="0.22"/><text x="96" y="1240" font-family="MTTM Lettering" font-weight="400" font-size="24.29" letter-spacing="0" text-anchor="start" fill="#4F5549">02 / 05</text><text x="984" y="1240" font-family="MTTM Lettering" font-weight="400" font-size="24.29" letter-spacing="0" text-anchor="end" fill="#4F5549">MOBILITY</text></svg>