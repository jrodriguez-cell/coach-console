<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Workout card"><title>Workout card</title><rect width="1080" height="1920" fill="#0E0E0D"/><text x="96" y="360" font-family="MTTM Lettering" font-weight="400" font-size="24.29" letter-spacing="0" text-anchor="start" fill="#8F8B83">TODAY’S SESSION</text><text x="96" y="500" font-family="MTTM Lettering" font-weight="400" font-size="62.86" letter-spacing="0" text-anchor="start" fill="#B7C0AE" data-field="title">LOWER BODY</text><text x="96" y="580" font-family="Manrope" font-weight="400" font-size="36.11" letter-spacing="0" text-anchor="start" fill="#8F8B83" data-field="meta">45 min · 4 exercises</text><rect x="96" y="650" width="888" height="2" fill="#B7C0AE" fill-opacity="0.4"/><text x="96" y="746" font-family="Manrope" font-weight="600" font-size="50" letter-spacing="0" text-anchor="start" fill="#B7C0AE" data-field="exercise1">Goblet squat</text><text x="984" y="746" font-family="Manrope" font-weight="600" font-size="50" letter-spacing="0" text-anchor="end" fill="#B7C0AE" data-field="sets1">4 × 8</text><text x="96" y="802" font-family="Manrope" font-weight="400" font-size="33.33" letter-spacing="0" text-anchor="start" fill="#8F8B83" data-field="note1">Rest 90 s</text><rect x="96" y="840" width="888" height="2" fill="#B7C0AE" fill-opacity="0.22"/><text x="96" y="936" font-family="Manrope" font-weight="600" font-size="50" letter-spacing="0" text-anchor="start" fill="#B7C0AE" data-field="exercise2">Romanian deadlift</text><text x="984" y="936" font-family="Manrope" font-weight="600" font-size="50" letter-spacing="0" text-anchor="end" fill="#B7C0AE" data-field="sets2">3 × 10</text><text x="96" y="992" font-family="Manrope" font-weight="400" font-size="33.33" letter-spacing="0" text-anchor="start" fill="#8F8B83" data-field="note2">Rest 90 s</text><rect x="96" y="1030" width="888" height="2" fill="#B7C0AE" fill-opacity="0.22"/><text x="96" y="1126" font-family=