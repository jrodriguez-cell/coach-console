<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Tip card"><title>Tip card</title><rect width="1080" height="1920" fill="#EFEBE3"/><text x="96" y="360" font-family="MTTM Lettering" font-weight="400" font-size="24.29" letter-spacing="0" text-anchor="start" fill="#4F5549">MOBILITY</text><text x="96" y="500" font-family="MTTM Lettering" font-weight="400" font-size="62.86" letter-spacing="0" text-anchor="start" fill="#0E0E0D" data-field="title1">THREE HIP</text><text x="96" y="596" font-family="MTTM Lettering" font-weight="400" font-size="62.86" letter-spacing="0" text-anchor="start" fill="#0E0E0D" data-field="title2">OPENERS</text><rect x="96" y="760" width="888" height="2" fill="#0E0E0D" fill-opacity="0.22"/><text x="96" y="864" font-family="MTTM Lettering" font-weight="400" font-size="37.14" letter-spacing="0" text-anchor="start" fill="#0E0E0D">01</text><text x="266" y="864" font-family="Manrope" font-weight="600" font-size="50" letter-spacing="0" text-anchor="start" fill="#0E0E0D" data-field="item1">90/90 switches</text><text x="266" y="924" font-family="Manrope" font-weight="400" font-size="36.11" letter-spacing="0" text-anchor="start" fill="#4F5549" data-field="detail1">8 slow reps each side</text><rect x="96" y="990" width="888" height="2" fill="#0E0E0D" fill-opacity="0.22"/><text x="96" y="1094" font-family="MTTM Lettering" font-weight="400" font-size="37.14" letter-spacing="0" text-anchor="start" fill="#0E0E0D">02</text><text x="266" y="1094" font-family="Manrope" font-weight="600" font-size="50" letter-spacing="0" text-anchor="start" fill="#0E0E0D" data-field="item2">Deep squat hold</text><text x="266" y="1154" font-family="Manrope" font-weight="400" font-size="36.11" letter-spacing="0" text-anchor="start" fill="#4F5549" data-field="detail2">45 seconds, heels down</text><rect x="96" y="1220" width="888" height="2" fill="#0E0E0D" fill-opacity="0.22"/><text x="96" y="1324" font-family="MTTM Lettering" font-weight="400" font-size="37.14" letter-spacing="0" text-anchor="start" fill="#0E0E0D">03</text><text x="266" y="1324" font-family="Manrope" font-weight="600" font-size="50" letter-spacing="0" text-anchor="start" fill="#0E0E0D" data-field="item3">Half-kneeling stretch</text><text x="266" y="1384" font-family="Manrope" font-weight="400" font-size="36.11" letter-spacing="0" text-anchor="start" fill="#4F5549" data-field="detail3">30 seconds each side</text><text x="96" y="1540" font-family="MTTM Lettering" font-weight="400" font-size="21.43" letter-spacing="0" text-anchor="start" fill="#4F5549">@MAKETIMETOMOVE</text></svg>