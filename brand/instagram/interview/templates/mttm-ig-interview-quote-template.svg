<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Interview quote"><title>Interview quote</title><rect width="1080" height="1920" fill="#1E2A23"/><text x="96" y="360" font-family="MTTM Lettering" font-weight="400" font-size="24.29" letter-spacing="0" text-anchor="start" fill="#8C948D">WHY THEY MAKE TIME</text><rect x="96" y="410" width="888" height="2" fill="#E8E6DD" fill-opacity="0.22"/><text x="96" y="640" font-family="Manrope" font-weight="600" font-size="69.44" letter-spacing="0" text-anchor="start" fill="#E8E6DD" data-field="quote1">“I used to wait for</text><text x="96" y="744" font-family="Manrope" font-weight="600" font-size="69.44" letter-spacing="0" text-anchor="start" fill="#E8E6DD" data-field="quote2">a free hour. Now I</text><text x="96" y="848" font-family="Manrope" font-weight="600" font-size="69.44" letter-spacing="0" text-anchor="start" fill="#E8E6DD" data-field="quote3">take the ten minutes</text><text x="96" y="952" font-family="Manrope" font-weight="600" font-size="69.44" letter-spacing="0" text-anchor="start" fill="#E8E6DD" data-field="quote4">I actually have.”</text><rect x="96" y="1096" width="120" height="2" fill="#E8E6DD" fill-opacity="0.4"/><text x="96" y="1186" font-family="MTTM Lettering" font-weight="400" font-size="28.57" letter-spacing="0" text-anchor="start" fill="#E8E6DD" data-field="name">MARIA, 41</text><text x="96" y="1246" font-family="Manrope" font-weight="400" font-size="33.33" letter-spacing="0" text-anchor="start" fill="#8C948D" data-field="detail">Nurse · Brooklyn</text><rect x="865.44" y="1401.44" width="117.12" height="117.12" fill="none" stroke="#E8E6DD" stroke-width="2.88"/><path fill="#E8E6DD" d="M888 1448H890.88V1429.26L898.17 1445.84H901.83L909.12 1429.26V1448H912V1424H908.29L900 1442.84L891.71 1424H888Z M936 1426.64H946.56V1448H949.44V1426.64H960V1424H936Z M888 1474.64H898.56V1496H901.44V1474.64H912V1472H888Z M936 1496H938.88V1477.26L946.17 1493.84H949.83L957.12 1477.26V1496H960V1472H956.29L948 1490.84L939.71 1472H936Z"/></svg>